<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Compare Test Fixture</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; }

  .heading {
    font-size: 72px;
    line-height: 1.1;
    color: #ffffff;
    background-color: #000000;
    padding: 40px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: -1.8px;
  }

  .eyebrow {
    font-size: 14px;
    color: rgb(255, 255, 255);
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 300;
    padding: 20px 40px 0;
    background-color: #000;
  }

  .with-pseudo::before {
    content: "";
    display: block;
    width: 60px;
    height: 4px;
    background-color: #ff0000;
    margin-bottom: 16px;
  }

  .no-pseudo {
    font-size: 16px;
    color: #333;
    padding: 20px;
  }

  .container {
    width: 1360px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 24px;
    padding: 40px;
    background: #111;
  }

  .child-a {
    width: 200px;
    height: 100px;
    background: #222;
  }

  .child-b {
    width: 200px;
    height: 100px;
    background: #333;
  }

  .overflow-child {
    position: relative;
    width: 1500px;
    height: 50px;
    background: rgba(255, 0, 0, 0.2);
    margin-left: -60px;
  }

  .empty-element {
    display: block;
  }

  @keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.5; }
    100% { opacity: 1; }
  }

  .animated {
    animation: pulse 2s infinite;
    font-size: 20px;
    color: white;
    background: #000;
    padding: 10px;
  }
</style>
</head>
<body>
  <div class="eyebrow with-pseudo">Eyebrow Text</div>
  <h1 class="heading">Test Heading</h1>
  <p class="no-pseudo">No pseudo element here</p>
  <div class="container">
    <div class="child-a">Child A</div>
    <div class="child-b">Child B</div>
    <div class="overflow-child">Overflow child</div>
  </div>
  <div class="empty-element"></div>
  <div class="animated">Animated element</div>
</body>
</html>
